name: SAST Scanner

on:
  # No path filter here: "Static Analysis (Bandit)" is a required check, so it must report
  # on every pull request. The job itself skips quickly when there is no Python source.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
  workflow_dispatch:

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    uses: vindicta-platform/.github/.github/workflows/sast-scanner-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      contents: read
