name: SAST Scanner

on:
  # No path filter here: "Static Analysis (Bandit)" is a required check, so it must report
  # on every pull request. The job itself skips quickly when there is no Python source.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    uses: vindicta-platform/.github/.github/workflows/sast-scanner-template.yml@b25991df3c05c3faa4a1376ba206492f8b2ad504 # main
    permissions:
      contents: read
