name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  ci:
    uses: vindicta-platform/.github/.github/workflows/ci-python-template.yml@main
    permissions:
      contents: read
      pull-requests: write

  docs:
    name: Docs Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install docs deps
        run: uv pip install --system mkdocs-material mkdocs-monorepo-plugin pymdown-extensions
      - name: Check docs build
        run: mkdocs build --strict
