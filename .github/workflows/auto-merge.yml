name: Auto-Merge PR

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto-merge:
    # Opt-in only. With auto-merge disabled in repository settings this job can only fail,
    # and with zero required reviews it should not be enabled without a deliberate decision.
    if: vars.AUTO_MERGE_ENABLED == 'true'
    uses: vindicta-platform/.github/.github/workflows/auto-merge-template.yml@461885a5f217f1ed82f3e1002724f8c1c6b74201 # main
    permissions:
      pull-requests: write
      contents: write
